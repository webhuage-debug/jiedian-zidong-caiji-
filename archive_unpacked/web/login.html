<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M18 34h28M18 24h28M18 44h18' stroke='%233dd6b5' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/adminhuage/styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel">
      <p class="eyebrow">ADMIN LOGIN</p>
      <h1>节点后台</h1>
      <p class="subtitle">请输入后台账号。初始账号为 admin / admin888，登录后建议立即修改。</p>
      <form id="loginForm" class="login-form">
        <label>用户名
          <input id="loginUsername" autocomplete="username" value="admin">
        </label>
        <label>密码
          <input id="loginPassword" type="password" autocomplete="current-password" value="admin888">
        </label>
        <button class="primary" type="submit">登录后台</button>
      </form>
      <p class="login-hint" id="loginHint">后台 API 与订阅导出都需要登录验证。</p>
    </section>
  </main>
  <script src="/adminhuage/login.js"></script>
</body>
</html>
